<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Minha Primeira Calculadora</title>

  <!-- ========== PARTE 1: CSS (a "roupa" da página) ========== -->
  <style>
    body {
      background: #1e1e2f;          /* cor de fundo da página */
      display: flex;                /* centra a calculadora */
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .calculadora {
      background: #2b2b40;
      padding: 20px;
      border-radius: 20px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #visor {
      background: #11111b;
      color: #00ffcc;
      font-size: 32px;
      text-align: right;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      min-height: 40px;
      overflow-x: auto;             /* se o número for grande, faz scroll */
    }

    .botoes {
      display: grid;                          /* organiza os botões em grelha */
      grid-template-columns: repeat(4, 1fr);  /* 4 colunas iguais */
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #3d3d5c;
      color: white;
      cursor: pointer;
    }

    button:hover  { background: #50507a; }   /* quando passas o rato */
    button:active { transform: scale(0.95); } /* efeito de "clique" */

    .operador { background: #ff9500; }
    .igual    { background: #00c27a; grid-column: span 2; } /* ocupa 2 colunas */
    .limpar   { background: #ff3b30; }
  </style>
</head>
<body>

  <!-- ========== PARTE 2: HTML (o "esqueleto" da página) ========== -->
  <div class="calculadora">
    <div id="visor">0</div>

    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button onclick="apagar()">⌫</button>
      <button class="operador" onclick="escolherOperacao('÷')">÷</button>
      <button class="operador" onclick="escolherOperacao('×')">×</button>

      <button onclick="adicionarNumero('7')">7</button>
      <button onclick="adicionarNumero('8')">8</button>
      <button onclick="adicionarNumero('9')">9</button>
      <button class="operador" onclick="escolherOperacao('-')">−</button>

      <button onclick="adicionarNumero('4')">4</button>
      <button onclick="adicionarNumero('5')">5</button>
      <button onclick="adicionarNumero('6')">6</button>
      <button class="operador" onclick="escolherOperacao('+')">+</button>

      <button onclick="adicionarNumero('1')">1</button>
      <button onclick="adicionarNumero('2')">2</button>
      <button onclick="adicionarNumero('3')">3</button>
      <button onclick="adicionarNumero('0')">0</button>

      <button onclick="adicionarNumero('.')">.</button>
      <button onclick="adicionarNumero('00')">00</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>
  </div>

  <!-- ========== PARTE 3: JavaScript (o "cérebro" da página) ========== -->
  <script>
    // Variáveis: são "caixinhas" onde guardamos informação
    let numeroAtual = '';     // o número que estás a escrever agora
    let numeroAnterior = '';  // o número antes do operador
    let operacao = null;      // +, -, × ou ÷

    const visor = document.getElementById('visor'); // vai buscar o visor ao HTML

    // Quando clicas num número
    function adicionarNumero(numero) {
      // não deixa pôr dois pontos no mesmo número (ex: 3..5)
      if (numero === '.' && numeroAtual.includes('.')) return;
      numeroAtual = numeroAtual + numero;
      actualizarVisor();
    }

    // Quando clicas em +, -, × ou ÷
    function escolherOperacao(op) {
      if (numeroAtual === '') return;          // sem número, não há conta
      if (numeroAnterior !== '') calcular();   // permite fazer 2 + 3 + 4...
      operacao = op;
      numeroAnterior = numeroAtual;
      numeroAtual = '';
      actualizarVisor();
    }

    // Quando clicas em =
    function calcular() {
      const a = parseFloat(numeroAnterior); // converte texto em número
      const b = parseFloat(numeroAtual);
      if (isNaN(a) || isNaN(b)) return;     // se faltar algum número, sai

      let resultado;
      switch (operacao) {
        case '+': resultado = a + b; break;
        case '-': resultado = a - b; break;
        case '×': resultado = a * b; break;
        case '÷':
          if (b === 0) {
            alert('Dividir por zero? Nem o professor de Matemática consegue!');
            limpar();
            return;
          }
          resultado = a / b;
          break;
        default: return;
      }

      // arredonda para evitar coisas estranhas como 0.1 + 0.2 = 0.30000000000000004
      numeroAtual = String(Math.round(resultado * 1e10) / 1e10);
      operacao = null;
      numeroAnterior = '';
      actualizarVisor();
    }

    // Botão C: apaga tudo
    function limpar() {
      numeroAtual = '';
      numeroAnterior = '';
      operacao = null;
      actualizarVisor();
    }

    // Botão ⌫: apaga o último dígito
    function apagar() {
      numeroAtual = numeroAtual.slice(0, -1);
      actualizarVisor();
    }

    // Mostra no visor o que está a acontecer
    function actualizarVisor() {
      if (operacao) {
        visor.textContent = numeroAnterior + ' ' + operacao + ' ' + numeroAtual;
      } else {
        visor.textContent = numeroAtual || '0';
      }
    }
  </script>

</body>
</html>
